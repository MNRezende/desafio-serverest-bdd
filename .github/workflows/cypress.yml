name: Cypress BDD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CYPRESS_ENVIRONMENT: development
      CYPRESS_BASE_URL: ${{ secrets.CYPRESS_BASE_URL || vars.CYPRESS_BASE_URL || 'https://front.serverest.dev' }}
      CYPRESS_API_URL: ${{ secrets.CYPRESS_API_URL || vars.CYPRESS_API_URL || 'https://serverest.dev' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress tests
        run: npm run cy:run:ci

      - name: Upload Cypress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts-${{ github.run_id }}
          path: |
            cypress/reports/
            cypress/screenshots/
          if-no-files-found: ignore
          retention-days: 7
